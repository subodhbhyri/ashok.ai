id: change-display-scaling
title: Make text and apps bigger or smaller
scope: system
os: [win11]
examples:
  - make everything on the screen bigger
  - the text is too small
  - change display scaling
  - make the screen text larger
  - how do I zoom the whole screen
steps:
  - id: s1
    say: Press the Windows key and the letter I together to open Settings.
    action: pressKeys
    keys: Win+I
    doneWhen: { kind: elementVisible, target: { role: ListItem, name: System } }
  - id: s2
    say: Click System on the left.
    action: click
    target: { role: ListItem, name: System }
    doneWhen: { kind: elementVisible, target: { role: ListItem, name: Display } }
  - id: s3
    say: Click Display.
    action: click
    target: { role: ListItem, name: Display }
    doneWhen:
      kind: elementVisible
      target: { role: Button, name: Detect, automationId: SystemSettings_Display_Detect_Button }
  - id: s4
    say: Scroll down until you see Scale.
    action: observe
    doneWhen:
      kind: elementVisible
      target: { role: ComboBox, name: Scale, automationId: SystemSettings_Display_Scaling_ItemSizeOverride_ComboBox }
  - id: s5
    say: Click the Scale box and choose a bigger percentage. The screen changes straight away, and you can change it back.
    action: click
    target: { role: ComboBox, name: Scale, automationId: SystemSettings_Display_Scaling_ItemSizeOverride_ComboBox }
    doneWhen: { kind: userConfirms }
